<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Display Flex</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body{
            max-width: 1500px;
            margin: 0 auto;
        }
        .gallery{
            display: flex;
            flex-direction: column;
            gap: 1em;
            justify-content: center;
            align-items: center;
            
        }
        .gallery img{
            border-radius: 10px;
            box-shadow: 7px 7px rgb(5, 5, 5);
            background-color: rgb(83, 121, 218);
            padding: 7px;
        }
        @media(min-width:576px)
        {
            .gallery{
                flex-direction: row;
                flex-wrap: wrap;
                
            }
            .gallery img{
                width: 39%;
            }
        }
        @media(min-width:1280px)
        {
            .gallery{
                flex-direction: row;
                flex-wrap: wrap;
            }
            .gallery img{
                width: 30%;
            }
        }
    </style>
</head>

<body>
    <h1>Galeria de imagenes flex</h1>
    <div class="gallery"> 
        <img src="https://picsum.photos/id/1058/600/400" alt="">
        <img src="https://picsum.photos/id/1057/600/400" alt="">
        <img src="https://picsum.photos/id/1055/600/400" alt="">
        <img src="https://picsum.photos/id/1054/600/400" alt="">
        <img src="https://picsum.photos/id/1052/600/400" alt="">
        <img src="https://picsum.photos/id/1051/600/400" alt="">
    </div>
</body>

</html>
